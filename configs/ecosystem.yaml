seed: 42

n_customers: 50000
n_merchants: 2000

start_date: 2026-01-05
n_days: 30
target_transactions: 1000000

n_festival_days: 2
festival_traffic_multiplier: 1.6

# Share of an offline merchant's customers who live in the merchant's city.
offline_local_share: 0.9
# Probability a customer pays from a device other than their usual one.
new_device_rate: 0.03
# Probability a transaction skips the merchant's primary gateway (load balancing / failover).
gateway_spillover_rate: 0.15
