# docker compose up --build   then open http://localhost:3000
#
# data/ and artifacts/ are mounted from the host: the dataset is generated on first start if
# missing, but the shared-representation ensemble takes over an hour to train, so train it once
# on the host (python scripts/train.py) or drop it from VULCAN_PREDICTORS.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts:ro
      - ./experiments:/app/experiments:ro
    environment:
      VULCAN_PREDICTORS: ${VULCAN_PREDICTORS:-rule_baseline,independent_ml,shared_representation}
      VULCAN_DEFAULT_PREDICTOR: ${VULCAN_DEFAULT_PREDICTOR:-shared_representation}
      VULCAN_LLM_API_KEY: ${VULCAN_LLM_API_KEY:-}
      VULCAN_LLM_MODEL: ${VULCAN_LLM_MODEL:-claude-haiku-4-5-20251001}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Startup loads the dataset and fits the independent models: a few minutes on a laptop.
      start_period: 600s

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
